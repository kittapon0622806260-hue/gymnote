<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link href="/src/style.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <title>gymnote</title>
</head>

<body class="m-0 p-0 box-border font-sans">
  <main class="grid grid-cols-[285px_1fr]  min-h-screen">
    <aside class=" bg-[#06080C] border-r-1 border-[#8F9CAE]/10 h-screen sticky top-0 ">
      <div class="flex items-center p-5">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-[#22C55E]" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6.5 6.5 11 11" />
          <path d="m21 21-1-1" />
          <path d="m3 3 1 1" />
          <path d="m18 22 4-4" />
          <path d="m2 6 4-4" />
          <path d="m3 10 7-7" />
          <path d="m14 21 7-7" />
        </svg>
        <span class="text-2xl text-[#fff] font-bold ml-4">GymNote</span>
      </div>
      <ul>
        <li class="p-4 hover:bg-[#8F9CAE]/10 text-[#8F9CAE] hover:text-[#22C55E] transition delay-50"><a href=#
            class="flex items-center gap-3"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
              fill="currentColor" class="size-6">
              <path
                d="M11.47 3.841a.75.75 0 0 1 1.06 0l8.69 8.69a.75.75 0 1 0 1.06-1.061l-8.689-8.69a2.25 2.25 0 0 0-3.182 0l-8.69 8.69a.75.75 0 1 0 1.061 1.06l8.69-8.689Z" />
              <path
                d="m12 5.432 8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 0 1-.75-.75v-4.5a.75.75 0 0 0-.75-.75h-3a.75.75 0 0 0-.75.75V21a.75.75 0 0 1-.75.75H5.625a1.875 1.875 0 0 1-1.875-1.875v-6.198a2.29 2.29 0 0 0 .091-.086L12 5.432Z" />
            </svg>
            Home</a>
        </li>
        <li class="p-4 hover:bg-[#8F9CAE]/10 text-[#8F9CAE] hover:text-[#22C55E] transition delay-50"><a href=#
            class="flex items-center gap-3"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
              fill="currentColor" class="size-6">
              <path fill-rule="evenodd"
                d="M6.32 2.577a49.255 49.255 0 0 1 11.36 0c1.497.174 2.57 1.46 2.57 2.93V21a.75.75 0 0 1-1.085.67L12 18.089l-7.165 3.583A.75.75 0 0 1 3.75 21V5.507c0-1.47 1.073-2.756 2.57-2.93Z"
                clip-rule="evenodd" />
            </svg>
            Workouts</a></li>
        <li class="p-4 hover:bg-[#8F9CAE]/10 text-[#8F9CAE] hover:text-[#22C55E] transition delay-50"><a href=#
            class="flex items-center gap-3"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
              fill="currentColor" class="size-6">
              <path fill-rule="evenodd"
                d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25ZM12.75 6a.75.75 0 0 0-1.5 0v6c0 .414.336.75.75.75h4.5a.75.75 0 0 0 0-1.5h-3.75V6Z"
                clip-rule="evenodd" />
            </svg>
            History</a></li>
        <li class="p-4 hover:bg-[#8F9CAE]/10 text-[#8F9CAE] hover:text-[#22C55E] transition delay-50"><a href=#
            class="flex items-center gap-3"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
              fill="currentColor" class="size-6">
              <path fill-rule="evenodd"
                d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z"
                clip-rule="evenodd" />
            </svg>
            Profile</a></li>
    </aside>
    <section class="bg-[#090B10] min-h-screen pb-32 p-8">
      <div class="flex items-center justify-between p-5 border-b-1 border-[#8F9CAE]/10">
        <div>
          <span class="text-[#fff] text-xl font-bold">Home</span>
          <div id="date-now" class="text-sm"></div>
        </div>
        <a href="#" class="text-[#22C55E]">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-10">
            <path fill-rule="evenodd"
              d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
              clip-rule="evenodd" />
          </svg>
        </a>
      </div>

      <div class="p-5 mt-7 ml-6">
        <span class="text-[#fff] text-5xl font-bold">Ready to Train,</span>
        <span id="username" class="text-[#22C55E] text-5xl font-bold"></span>
      </div>
      <div class=" bg-white/5 border border-white/10 p-6 mx-6 mt-10 rounded-2xl flex items-center justify-between">
        <div>
          <span class="text-lg uppercase tracking-wider text-[#22C55E] font-semibold">Today's Workout</span>
          <h2 id="workout-title" class="text-2xl font-bold mt-1 text-white"></h2>
          <p id="workout-sub" class="text-sm text-slate-400 mt-1"></p>
        </div>

        <button id="workout-btn"
          class="bg-[#22C55E] hover:bg-[#16a34a] text-slate-950 font-bold px-6 py-3 rounded-lg transition cursor-pointer">
          Start Workout →
        </button>
      </div>

      <!-- Stats Grid -->
      <div class="grid grid-cols-3 gap-4 m-6 ">
        <div class="bg-white/5 border border-white/10 p-5 rounded-xl">
          <span class="text-xs text-slate-400">Weekly Volume</span>
          <p id="stat-volume" class="text-2xl font-bold mt-1 text-white">0 KG</p>
        </div>
        <div class="bg-white/5 border border-white/10 p-5 rounded-xl">
          <span class="text-xs text-slate-400">Workouts</span>
          <p id="stat-count" class="text-2xl font-bold mt-1 text-white">0 / 7</p>
        </div>
        <div class="bg-white/5 border border-white/10 p-5 rounded-xl">
          <span class="text-xs text-slate-400">Consistency</span>
          <p id="stat-progress" class="text-2xl font-bold mt-1 text-white">0%</p>
        </div>
      </div>
      <div class="mt-16  flex  justify-center">
        <div class="text-xl font-semibold text-white">Recent Activities</div>
      </div>
      <div id="history" class="mt-15">
        <div class="flex justify-center mt-5">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-20">
            <path
              d="M3.375 3C2.339 3 1.5 3.84 1.5 4.875v.75c0 1.036.84 1.875 1.875 1.875h17.25c1.035 0 1.875-.84 1.875-1.875v-.75C22.5 3.839 21.66 3 20.625 3H3.375Z" />
            <path fill-rule="evenodd"
              d="m3.087 9 .54 9.176A3 3 0 0 0 6.62 21h10.757a3 3 0 0 0 2.995-2.824L20.913 9H3.087Zm6.133 2.845a.75.75 0 0 1 1.06 0l1.72 1.72 1.72-1.72a.75.75 0 1 1 1.06 1.06l-1.72 1.72 1.72 1.72a.75.75 0 1 1-1.06 1.06L12 15.685l-1.72 1.72a.75.75 0 1 1-1.06-1.06l1.72-1.72-1.72-1.72a.75.75 0 0 1 0-1.06Z"
              clip-rule="evenodd" />
          </svg>
        </div>
        <div class="text-center text-slate-400 mt-2"> History Available</div>
      </div>
    </section>
  </main>
  <script src="/src/index.js" type="module"></script>
</body>


</html>
