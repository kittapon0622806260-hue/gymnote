<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="/src/style.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <title>GymNote-Home</title>
  <link rel="icon" type="image/svg+xml" href="../assets/db.svg">
</head>

<body class="m-0 p-0 box-border font-sans bg-[#090B10] text-slate-100 min-h-screen">
  <main class="grid grid-cols-1 md:grid-cols-[285px_1fr] min-h-screen">
    <load src="/src/components/sidebar.html" />
    <section class="bg-[#090B10] min-h-screen pb-32 p-4 sm:p-6 md:p-8 min-w-0">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-5 sm:pb-7 border-b border-[#8F9CAE]/10 gap-3">
        <div>
          <span class="text-white text-xl font-bold">Home</span>
          <div id="date-now" class="text-sm text-slate-400"></div>
        </div>
        <div class="flex items-center gap-3">
          <!-- ปุ่มสลับเมื่อยังไม่ได้ Login -->
          <div id="authButtons" class="flex gap-2">
            <a href="/login.html"
              class="px-3.5 py-2 text-sm font-semibold text-zinc-300 hover:text-white transition">เข้าสู่ระบบ</a>
            <a href="/register.html"
              class="px-4 py-2 text-sm font-semibold bg-[#22C55E] hover:bg-[#16a34a] text-zinc-950 rounded-lg transition">สมัครสมาชิก</a>
          </div>
        </div>
      </div>

      <div class="py-4 sm:py-6 mt-4 sm:mt-6">
        <span class="text-white text-3xl sm:text-4xl md:text-5xl font-bold block sm:inline">Ready to Train,</span>
        <span id="username" class="text-[#22C55E] text-3xl sm:text-4xl md:text-5xl font-bold block sm:inline"></span>
      </div>

      <div class="bg-white/5 border border-white/10 p-5 sm:p-6 mt-6 sm:mt-8 rounded-2xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
          <span class="text-xs sm:text-sm uppercase tracking-wider text-[#22C55E] font-semibold">Today's Workout</span>
          <h2 id="workout-title" class="text-xl sm:text-2xl font-bold mt-1 text-white"></h2>
          <p id="workout-sub" class="text-xs sm:text-sm text-slate-400 mt-1"></p>
        </div>

        <a id="workout-btn" href="/workouts/workouts.html"
          class="w-full sm:w-auto text-center bg-[#22C55E] hover:bg-[#16a34a] text-slate-950 font-bold px-6 py-3 rounded-xl transition cursor-pointer shrink-0">
          Start Workout →
        </a>
      </div>

      <!-- Stats Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-6">
        <div class="bg-white/5 border border-white/10 p-4 sm:p-5 rounded-xl">
          <span class="text-xs text-slate-400">Time Total</span>
          <p id="workouts-stat-time" class="text-xl sm:text-2xl font-bold mt-1 text-white">0 </p>
        </div>
        <div class="bg-white/5 border border-white/10 p-4 sm:p-5 rounded-xl">
          <span class="text-xs text-slate-400">Workouts</span>
          <p id="workouts-stat-days" class="text-xl sm:text-2xl font-bold mt-1 text-white">0 / 7</p>
        </div>
      </div>
    </section>
  </main>
  <script src="/src/index.js" type="module"></script>
  <script type="module" src="/src/components/sidebar.js"></script>
</body>

</html>
