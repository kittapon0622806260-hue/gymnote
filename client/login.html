<!DOCTYPE html>
<html lang="th" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <title>gymnote</title>
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased">

    <main class="w-full max-w-md bg-zinc-900/90 border border-zinc-800/80 rounded-2xl p-8 shadow-2xl backdrop-blur-sm">

        <!-- Header / Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-6 mb-2">
                <!-- SVG Dumbbell Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-[#22C55E]" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6.5 6.5 11 11" />
                    <path d="m21 21-1-1" />
                    <path d="m3 3 1 1" />
                    <path d="m18 22 4-4" />
                    <path d="m2 6 4-4" />
                    <path d="m3 10 7-7" />
                    <path d="m14 21 7-7" />
                </svg>
                <h1 class="text-3xl font-extrabold text-white tracking-tight">GymNote</h1>
            </div>
            <p class="text-sm text-zinc-400">ยินดีต้อนรับกลับมา! กรุณาเข้าสู่ระบบ</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-5">

            <!-- Email -->
            <div>
                <label for="email"
                    class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Email</label>
                <input type="email" id="email" required placeholder="name@example.com"
                    class="w-full px-4 py-3 bg-zinc-800/80 border border-zinc-700/80 rounded-xl text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-[#22C55E] focus:border-transparent transition text-sm" />
            </div>

            <!-- Password -->
            <div>
                <label for="password"
                    class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Password</label>
                <input type="password" id="password" required placeholder="••••••••"
                    class="w-full px-4 py-3 bg-zinc-800/80 border border-zinc-700/80 rounded-xl text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-[#22C55E] focus:border-transparent transition text-sm" />
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full py-3.5 px-4 bg-[#22C55E] hover:bg-[#16a34a] text-zinc-950 font-bold rounded-xl transition duration-200 shadow-lg shadow-[#22C55E]/20 active:scale-[0.98] text-sm mt-2 cursor-pointer">
                เข้าสู่ระบบ
            </button>
        </form>

        <!-- Footer Link -->
        <div class="text-center text-sm text-zinc-400 mt-8">
            ยังไม่มีบัญชี?
            <a href="/register.html"
                class="text-[#22C55E] font-semibold hover:underline hover:text-[#16a34a] transition ml-1">
                สมัครสมาชิก
            </a>
        </div>

    </main>
    <script src="login.js"></script>
</body>

</html>
