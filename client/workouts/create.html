<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymNote-Create</title>
  <link rel="icon" type="image/svg+xml" href="/assets/db.svg">
  <link href="/src/style.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body class="m-0 p-0 box-border font-sans bg-[#090B10] text-white min-h-screen">

  <main class="min-h-screen">

    <!-- Main Content Area -->
    <section class="p-4 sm:p-6 md:p-8 max-w-4xl w-full mx-auto space-y-6 sm:space-y-8">

      <!-- Top Navigation & Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-white/10 pb-5">
        <div class="flex items-center gap-3 sm:gap-4">
          <!-- ปุ่ม Back ย้อนกลับไปหน้า workouts.html -->
          <a href="/workouts/workouts.html"
            class="p-2 sm:p-2.5 bg-white/5 hover:bg-white/10 rounded-xl border border-white/10 text-[#8F9CAE] hover:text-white transition shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
              stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
            </svg>
          </a>
          <div>
            <h1 class="text-xl sm:text-2xl font-bold text-white tracking-wide">Create New Routine</h1>
            <p class="text-xs text-[#8F9CAE]">สร้างตารางออกกำลังกายใหม่สำหรับประจำวันของคุณ</p>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-2 sm:gap-3 self-end sm:self-auto">
          <a href="/workouts/workouts.html"
            class="px-3.5 sm:px-4 py-2 bg-white/5 hover:bg-white/10 text-white font-semibold text-xs sm:text-sm rounded-xl border border-white/10 transition">
            Cancel
          </a>
          <!-- ปุ่ม Submit ฟอร์ม -->
          <button id="save-routine-btn" form="workout-form" type="submit"
            class="px-4 sm:px-5 py-2 bg-[#22C55E] hover:bg-[#1ea34d] text-black font-bold text-xs sm:text-sm rounded-xl transition cursor-pointer">
            Save Routine
          </button>
        </div>
      </div>

      <!-- Workout Form -->
      <form id="workout-form" class="space-y-6 sm:space-y-8">

        <!-- SECTION 1: General Info -->
        <div class="bg-[#06080C]/60 border border-white/5 rounded-2xl p-4 sm:p-6 space-y-4 sm:space-y-6">
          <h2 class="text-sm sm:text-base font-bold text-white border-b border-white/5 pb-3 flex items-center gap-2">
            <span>ข้อมูลทั่วไป (General Info)</span>
          </h2>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
            <!-- Routine Name Input -->
            <div class="space-y-2">
              <label for="routine-name" class="block text-xs font-semibold text-[#8F9CAE]">ชื่อโปรแกรมออกกำลังกาย
                *</label>
              <input type="text" id="routine-name" required placeholder="เช่น Push Day, Upper Body, Leg Focus"
                class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-[#8F9CAE]/40 focus:outline-none focus:border-[#22C55E] transition" />
            </div>

            <!-- Target Day Select -->
            <div class="space-y-2">
              <label for="target-day" class="block text-xs font-semibold text-[#8F9CAE]">ประจำวัน (Select Day) *</label>
              <select id="target-day"
                class="w-full bg-[#06080C] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#22C55E] transition">
                <option value="MON">Monday (วันจันทร์)</option>
                <option value="TUE">Tuesday (วันอังคาร)</option>
                <option value="WED">Wednesday (วันพุธ)</option>
                <option value="THU">Thursday (วันพฤหัสบดี)</option>
                <option value="FRI">Friday (วันศุกร์)</option>
                <option value="SAT">Saturday (วันเสาร์)</option>
                <option value="SUN">Sunday (วันอาทิตย์)</option>
              </select>
            </div>
          </div>

          <!-- Target Muscles Input -->
          <div class="space-y-2">
            <label for="target-muscles" class="block text-xs font-semibold text-[#8F9CAE]">กล้ามเนื้อเป้าหมาย (Target
              Muscles)</label>
            <input type="text" id="target-muscles" placeholder="เช่น Chest, Shoulders, Triceps"
              class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-[#8F9CAE]/40 focus:outline-none focus:border-[#22C55E] transition" />
          </div>
        </div>

        <!-- SECTION 2: Exercises List -->
        <div class="bg-[#06080C]/60 border border-white/5 rounded-2xl p-4 sm:p-6 space-y-4 sm:space-y-6">
          <div class="flex items-center justify-between border-b border-white/5 pb-3">
            <h2 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
              <span>รายการท่าฝึก (Exercises)</span>
            </h2>
            <button type="button" id="add-exercise-btn"
              class="px-3 py-1.5 bg-[#22C55E]/10 border border-[#22C55E]/30 text-[#22C55E] hover:bg-[#22C55E] hover:text-black font-semibold text-xs rounded-lg transition flex items-center gap-1 cursor-pointer">
              <span>+</span> เพิ่มท่าฝึก
            </button>
          </div>

          <!-- Container สำหรับใส่การ์ดท่าฝึก -->
          <div id="exercises-container" class="space-y-4">

            <!-- Default Exercise Card #1 -->
            <div class="exercise-item bg-white/5 border border-white/5 rounded-xl p-3.5 sm:p-4 space-y-3 sm:space-y-4">
              <div class="flex items-center justify-between">
                <span
                  class="exercise-number text-xs font-bold text-[#22C55E] bg-[#22C55E]/10 px-2.5 py-1 rounded-md">Exercise
                  1</span>
                <button type="button"
                  class="remove-exercise-btn text-xs text-[#8F9CAE] hover:text-red-400 transition cursor-pointer">ลบรายการ</button>
              </div>

              <div class="exercise-card grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">
                <div class="sm:col-span-1 space-y-1">
                  <label class="block text-[11px] text-[#8F9CAE]">ชื่อท่าเล่น *</label>
                  <input type="text" id="exercise-name" placeholder="เช่น Bench Press" required
                    class="exercise-name w-full bg-[#06080C] border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-[#22C55E]" />
                </div>
                <div class="space-y-1">
                  <label class="block text-[11px] text-[#8F9CAE]">จำนวนเซ็ต (Sets)</label>
                  <input type="number" id="exercise-sets" min="1" value="3"
                    class="exercise-sets w-full bg-[#06080C] border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-[#22C55E]" />
                </div>
                <div class="space-y-1">
                  <label class="block text-[11px] text-[#8F9CAE]">จำนวนครั้ง (Reps)</label>
                  <input type="text" id="exercise-reps" placeholder="เช่น 8-12" value="8-12"
                    class="exercise-reps w-full bg-[#06080C] border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-[#22C55E]" />
                </div>
              </div>
            </div>

          </div>
        </div>

      </form>
    </section>

  </main>
  <script type="module" src="/src/views/create.js"></script>
</body>

</html>
