<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GymNote-Edit</title>
    <link rel="icon" type="image/svg+xml" href="../assets/db.svg">
    <link href="/src/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="m-0 p-0 box-border font-sans bg-[#090B10] text-white min-h-screen">

    <main class=" min-h-screen">

        <!-- Main Content Area -->
        <section class="p-8 max-w-4xl w-full mx-auto space-y-8">

            <!-- Top Navigation & Header -->
            <div class="flex items-center justify-between border-b border-white/10 pb-5">
                <div class="flex items-center gap-4">
                    <!-- ปุ่ม Back ย้อนกลับไปหน้า workouts.html -->
                    <a href="workouts.html"
                        class="p-2 bg-white/5 hover:bg-white/10 rounded-xl border border-white/10 text-[#8F9CAE] hover:text-white transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                        </svg>
                    </a>
                    <div>
                        <div class="text-2xl font-bold text-white tracking-wide">Edit Routine</div>
                        <p class="text-xs text-[#8F9CAE]">แก้ไขตารางออกกำลังกายสำหรับประจำวันของคุณ</p>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center gap-3">
                    <a href="workouts.html"
                        class="px-4 py-2 bg-white/5 hover:bg-white/10 text-white font-semibold text-sm rounded-xl border border-white/10 transition">
                        Cancel
                    </a>
                    <!-- ปุ่ม Submit ฟอร์ม -->
                    <button id="save-routine-btn" form="workout-form" type="submit"
                        class="px-5 py-2 bg-[#22C55E] hover:bg-[#1ea34d] text-black font-bold text-sm rounded-xl transition cursor-pointer">
                        Save Routine
                    </button>
                </div>
            </div>

            <!-- Workout Form -->
            <form id="workout-form" class="space-y-8">

                <!-- SECTION 1: General Info -->
                <div class="bg-[#06080C]/60 border border-white/5 rounded-2xl p-6 space-y-6">
                    <h2 class="text-base font-bold text-white border-b border-white/5 pb-3 flex items-center gap-2">
                        <span class="text-white">ข้อมูลทั่วไป (General Info)</span>
                    </h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Routine Name Input -->
                        <div class="space-y-2">
                            <label for="routine-name"
                                class="block text-xs font-semibold text-[#8F9CAE]">ชื่อโปรแกรมออกกำลังกาย *</label>
                            <input type="text" id="routine-name" required
                                placeholder="เช่น Push Day, Upper Body, Leg Focus"
                                class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-[#8F9CAE]/40 focus:outline-none focus:border-[#22C55E] transition" />
                        </div>

                        <!-- Target Day Select -->
                        <div class="space-y-2">
                            <label for="target-day" class="block text-xs font-semibold text-[#8F9CAE]">ประจำวัน (Select
                                Day) *</label>
                            <select id="target-day"
                                class="w-full bg-[#06080C] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#22C55E] transition">
                                <option value="mon">Monday (วันจันทร์)</option>
                                <option value="tue">Tuesday (วันอังคาร)</option>
                                <option value="wed">Wednesday (วันพุธ)</option>
                                <option value="thu">Thursday (วันพฤหัสบดี)</option>
                                <option value="fri">Friday (วันศุกร์)</option>
                                <option value="sat">Saturday (วันเสาร์)</option>
                                <option value="sun">Sunday (วันอาทิตย์)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Target Muscles Input -->
                    <div class="space-y-2">
                        <label for="target-muscles"
                            class="block text-xs font-semibold text-[#8F9CAE]">กล้ามเนื้อเป้าหมาย (Target
                            Muscles)</label>
                        <input type="text" id="target-muscles" placeholder="เช่น Chest, Shoulders, Triceps"
                            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-[#8F9CAE]/40 focus:outline-none focus:border-[#22C55E] transition" />
                    </div>
                </div>

                <!-- SECTION 2: Exercises List -->
                <div class="bg-[#06080C]/60 border border-white/5 rounded-2xl p-6 space-y-6">
                    <div class="flex items-center justify-between border-b border-white/5 pb-3">
                        <h2 class="text-base font-bold text-white flex items-center gap-2">
                            <span class="text-white">รายการท่าฝึก (Exercises)</span>
                        </h2>
                        <button type="button" id="add-exercise-btn"
                            class="px-3 py-1.5 bg-[#22C55E]/10 border border-[#22C55E]/30 text-[#22C55E] hover:bg-[#22C55E] hover:text-black font-semibold text-xs rounded-lg transition flex items-center gap-1 cursor-pointer">
                            <span>+</span> เพิ่มท่าฝึก
                        </button>
                    </div>

                    <!-- Container สำหรับใส่การ์ดท่าฝึก -->
                    <div id="exercises-container" class="space-y-4"></div>
                </div>

            </form>
        </section>

    </main>
    <script src="/src/views/edit.js"></script>
</body>

</html>
