<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link href="/src/style.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <title>gymnote</title>
</head>

<body class="m-0 p-0 box-border font-sans bg-[#090B10]  min-h-screen font-sans">
    <!-- ================= HEADER BAR ================= -->
    <header class="bg-[#06080C]/80 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">

            <!-- ฝั่งซ้าย: ปุ่ม Back + ชื่อโปรแกรม -->
            <div class="flex items-center gap-6">
                <!-- เปลี่ยนจาก <a> เป็น <button> เพื่อดักฟัง Event เปิด Modal -->
                <button id="back-btn" type="button"
                    class="flex items-center gap-2 text-slate-400 hover:text-white transition-colors group px-3 py-1.5 rounded-xl hover:bg-slate-800/50">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                        stroke="currentColor" class="w-5 h-5 group-hover:-translate-x-1 transition-transform">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                    </svg>
                    <span class="text-lg font-medium">Back</span>
                </button>

                <div class="h-6 w-px bg-slate-800"></div>

                <!-- ชื่อ Routine & Target -->
                <div class="flex items-baseline gap-2">
                    <span id="title" class="text-3xl font-bold   text-[#22C55E] tracking-tight"></span>
                    <span id="target" class="text-lg font-medium text-slate-400 ml-3"></span>
                </div>
            </div>


            <div class="flex items-center gap-4">
                <!-- Active Workout Timer -->
                <div
                    class="flex items-center gap-2.5 bg-slate-900/90 border border-slate-800 px-4 py-2 rounded-2xl shadow-inner">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="active-timer"
                        class="font-mono text-lg font-bold text-white tracking-wider">00:00:00</span>
                </div>


                <button id="finish-btn" type="button" onclick="finishWorkout()"
                    class="bg-[#22C55E] hover:bg-[#1ea34d] text-slate-950 font-extrabold px-5 py-2 rounded-2xl flex items-center gap-2 shadow-lg shadow-emerald-500/10 transition-all active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                        stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3 3v1.5M3 21v-6m0 0 2.77-.693a9 9 0 0 1 6.208.682l.108.054a9 9 0 0 0 6.086.71l3.114-.732a48.524 48.524 0 0 0-.005-10.499l-3.11.732a9 9 0 0 1-6.085-.711l-.108-.054a9 9 0 0 0-6.208-.682L3 4.5M3 15V4.5" />
                    </svg>
                    <span>Finish</span>
                </button>
            </div>

        </div>
    </header>


    <div id="exit-modal"
        class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-sm w-full shadow-2xl transform scale-95 transition-transform duration-200"
            id="modal-card">

            <!-- Icon เตือน -->
            <div
                class="w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-500 flex items-center justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                </svg>
            </div>

            <!-- ข้อความ -->
            <h3 class="text-xl font-bold text-white mb-2">ออกจากการเล่น?</h3>
            <p class="text-slate-400 text-sm mb-6 leading-relaxed">
                ความก้าวหน้าในรอบนี้จะยังไม่ถูกบันทึก คุณแน่ใจหรือไม่ว่าต้องการออกจากหน้านี้?
            </p>

            <!-- ปุ่มกด 2 ฝั่ง -->
            <div class="flex items-center gap-3 mt-5">
                <button id="cancel-exit-btn" type="button"
                    class="flex-1 px-4 py-2.5 rounded-xl border border-slate-700 text-slate-300 font-semibold text-sm hover:bg-slate-800 transition-colors">
                    เล่นต่อ
                </button>
                <button id="confirm-exit-btn" type="button"
                    class="flex-1 px-4 py-2.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 font-semibold text-sm hover:bg-rose-500 hover:text-white transition-all">
                    ออกจากหน้านี้
                </button>
            </div>

        </div>
    </div>



    <main id="exercise-container" class="p-6 max-w-4xl mx-auto space-y-6">

    </main>


    <script type="module" src="/src/views/saveR.js"> </script>
</body>
